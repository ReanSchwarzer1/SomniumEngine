[package]
name    = "hello_engine"
version = "0.1.0"
edition.workspace     = true
rust-version.workspace = true
publish = false

# The editor shell is also a library, so a game can embed the whole editor (camera, imported meshes, terrain,
# previews) and add its own systems instead of copying them (Rimeborn, 18 Oct 2026). The binary is unchanged.
[lib]
name = "hello_engine"
path = "src/main.rs"

[[bin]]
name = "hello_engine"
path = "src/main.rs"

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = { workspace = true }

[dependencies]
somnium_anim = { workspace = true }
# Phase 16-C: attaching a script and routing its forces is game-layer work,
# so the example names the neutral scripting crate. It does not — and must
# not — name `somnium_script_luau`.
somnium_script = { workspace = true }
somnium_core       = { workspace = true }
somnium_ecs = { workspace = true }
somnium_renderer = { workspace = true }
somnium_physics = { workspace = true }
somnium_audio = { workspace = true }
somnium_asset = { workspace = true }
somnium_voxel = { workspace = true }
somnium_ui = { workspace = true }
# The combat sandbox (Create > Examples > Combat Sandbox).
somnium_character = { workspace = true }
somnium_combat = { workspace = true }
somnium_input = { workspace = true }
somnium_ai = { workspace = true }
glam = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
image = { workspace = true }
wgpu = { workspace = true }
