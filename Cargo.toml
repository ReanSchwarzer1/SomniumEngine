[workspace]
resolver = "2"
members = [
    "crates/somnium_core",
    "crates/somnium_ecs",
    "crates/somnium_anim",
    "crates/somnium_i18n",
    "crates/somnium_input",
    "crates/somnium_jobs",
    "crates/somnium_shader",
    "crates/somnium_script",
    "crates/somnium_script_luau",
    "crates/somnium_renderer",
    "crates/somnium_physics_sys",
    "crates/somnium_physics",
    "crates/somnium_audio",
    "crates/somnium_ui",
    "crates/somnium_asset",
    "crates/somnium_voxel",
    "examples/hello_engine",
    "examples/vvardenfell",
    "tools/assetcook",
]

# The `example_repo/` directory contains reference source code from
# Unreal Engine 5 (Epic Games) and the DirectX Shader Compiler (Microsoft).
# These are consulted for architectural patterns only — no source code is
# copied. See ATTRIBUTION.md for details.
exclude = ["example_repo"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Engine code targets 1.85 (edition 2024); the dependency tree raises the
# effective minimum to 1.88 (image), so that's what's declared and CI uses.
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["Somnium Engine Contributors"]

# ---------------------------------------------------------------------------
# Workspace-wide dependency declarations.
# Individual crate `Cargo.toml` files reference these via
# `dep = { workspace = true }` to keep versions in sync.
# ---------------------------------------------------------------------------
[workspace.dependencies]
# -- Internal crates --------------------------------------------------------
somnium_core     = { path = "crates/somnium_core" }
somnium_ecs      = { path = "crates/somnium_ecs" }
somnium_anim     = { path = "crates/somnium_anim" }
somnium_i18n     = { path = "crates/somnium_i18n" }
somnium_input    = { path = "crates/somnium_input" }
somnium_jobs     = { path = "crates/somnium_jobs" }
somnium_shader   = { path = "crates/somnium_shader" }
somnium_script   = { path = "crates/somnium_script" }
somnium_script_luau = { path = "crates/somnium_script_luau" }
somnium_renderer = { path = "crates/somnium_renderer" }
somnium_physics_sys = { path = "crates/somnium_physics_sys" }
somnium_physics  = { path = "crates/somnium_physics" }
somnium_audio    = { path = "crates/somnium_audio" }
somnium_ui       = { path = "crates/somnium_ui" }
somnium_asset    = { path = "crates/somnium_asset" }
somnium_voxel    = { path = "crates/somnium_voxel" }

# -- Windowing & Input ------------------------------------------------------
winit = "0.30"

# -- Graphics (Phase 2) -----------------------------------------------------
# `counters` is on in every build, not behind a feature. DOOM-J needs to be able
# to assert that a steady-state frame creates no buffers, textures or bind
# groups, and this repository's own lesson is that a gate you have to opt into
# is a gate that is off. The cost is one relaxed atomic per resource create and
# destroy, which in steady state is the number this exists to prove is zero.
wgpu = { version = "30.0", features = ["counters"] }

# -- Math --------------------------------------------------------------------
glam = "0.29"
bytemuck = { version = "1.21", features = ["derive"] }

# -- ECS concurrency (Phase 2) ----------------------------------------------
rayon = "1.12"

# -- Async Initialization ---------------------------------------------------
pollster = "0.3"

# -- Error handling ----------------------------------------------------------
thiserror = "2.0"
# PORTAL-0-C: `anyhow` removed. It was declared here and in
# `hello_engine`, and referenced by no source file in the workspace —
# MORROWIND-A_census.md flagged both rows and this closes them.

# -- Logging -----------------------------------------------------------------
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# -- Build dependencies ------------------------------------------------------
cc = "1.2"

# -- Audio -------------------------------------------------------------------
kira = "0.9"

# -- UI (Phase 6/9) ------------------------------------------------------------
# PORTAL-0-C: the `egui` / `egui-wgpu` / `egui-winit` triple is removed. Somnium
# has drawn its own editor since Phase 12 and no crate has referenced any of the
# three since; `phase_MORROWIND.md` §4.7 found them dead, MORROWIND-A's census
# carried them as "exempt — DEAD" and left the removal "to Phase PORTAL's CI
# gates rather than smuggling a cleanup into a census". This is that phase.
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"

# -- Asset loading -----------------------------------------------------------
gltf = { version = "1", features = ["names", "utils", "image", "KHR_texture_transform",
    "KHR_materials_transmission", "KHR_materials_emissive_strength"] }
image = "0.25"
exr = "1.74"

# -- Font rasterization (Phase 12A-4) ----------------------------------------
fontdue = "0.7"

# -- Text shaping and bidi (MORROWIND-G item 1, adopted in CS-CORRECTNESS #6) -
# Shaping only. `rustybuzz` is a HarfBuzz port that takes a face and a string
# and returns positioned glyph ids; it owns no font database, no atlas and no
# editing model, which is what lets it slot in behind the run model MORROWIND-G
# built rather than arriving as a second text stack beside `fontdue`.
rustybuzz    = "0.20"
unicode-bidi = "0.3"

# -- SVG rasterization (Phase 26-Zeta-E) --------------------------------------
# Builds the editor icon atlas from vendored Tabler + Somnium SVG sources at
# startup. Text, system fonts and raster-image support are off: every source is
# a stroked path, and the disabled features would drag in a second font stack
# beside fontdue. `resvg` re-exports `usvg` and `tiny_skia`, so it is the only
# entry needed here.
resvg = { version = "0.48", default-features = false }

# -- Voxel world (Phase 14) ---------------------------------------------------
block-mesh = "0.2"
ndshape    = "0.3"

# -- Native file dialogs (editor import, Phase 19B) --------------------------
rfd = "0.15"

# -- Scripting (Phase 16-B) --------------------------------------------------
# Luau through mlua, interpreter only. Pinned exactly: bytecode and the
# sandbox surface are both version-coupled, and `luau-jit` is deliberately
# absent — the portable interpreter is the Phase 16 baseline and native
# codegen is not enabled until a benchmark proves script execution, rather
# than boundary traffic, is the bottleneck.
#
# mlua 0.12 declares rust-version 1.88, which is exactly the workspace
# toolchain. A newer mlua may raise it; check before bumping.
#
# Luau is C++, built from source by `mlua-sys`. The MSVC toolchain was
# already required for Jolt, so this adds build time rather than a new
# prerequisite.
mlua = { version = "=0.12.0", features = ["luau", "serde", "send"] }

# -- Utilities ---------------------------------------------------------------
rand = "0.8"

# Phase 25K: decode image codecs at full optimisation even in a debug build.
#
# The engine runs in debug for development, and `image` in debug is roughly two
# orders of magnitude slower — decoding the terrain layers took longer than a
# 90-second timeout, and the glTF demo scene already spent ~7 s here. These are
# third-party leaf crates nobody steps through, so optimising them costs no
# debuggability at all.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
