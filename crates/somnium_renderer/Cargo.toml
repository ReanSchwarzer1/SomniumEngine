[package]
name        = "somnium_renderer"
description = "wgpu-based rendering backend for the Somnium Engine."
version.workspace     = true
edition.workspace     = true
rust-version.workspace = true
license.workspace     = true
authors.workspace     = true

[dependencies]
somnium_ecs  = { workspace = true }
wgpu         = { workspace = true }
winit        = { workspace = true }
glam         = { workspace = true }
tracing      = { workspace = true }
pollster     = { workspace = true }
somnium_ui   = { workspace = true }
bytemuck     = { workspace = true }
somnium_asset = { workspace = true }
# Phase 25K: decoding the packed terrain layer PNGs at load.
image        = { workspace = true }
exr          = { workspace = true }

[dev-dependencies]
# Shader compilation happens at device-creation time, so a WGSL mistake used to
# surface as a first-frame crash on a machine with a GPU and nowhere else.
# naga is wgpu's own front end and is already in the dependency graph, so
# parsing and validating each concatenated module in a test costs nothing and
# catches the whole class before it ships.
naga = { version = "29", features = ["wgsl-in"] }
# Offline BC7 encoder for `examples/encode_terrain_bc7.rs`. Precompiled ISPC
# kernels (Traverse Research fork of Graham Wihlidal's intel_tex). Not linked
# into the engine binary.
intel_tex_2 = "0.5.0"
