[package]
name        = "somnium_renderer"
description = "wgpu-based rendering backend for the Somnium Engine."
version.workspace     = true
edition.workspace     = true
rust-version.workspace = true
license.workspace     = true
authors.workspace     = true

[dependencies]
somnium_ecs  = { workspace = true }
wgpu         = { workspace = true }
winit        = { workspace = true }
glam         = { workspace = true }
tracing      = { workspace = true }
somnium_ui   = { workspace = true }
# MORROWIND-U. Seam 7: the renderer takes matrices, and the crate that produces
# them has no renderer dependency of its own. This edge points one way.
somnium_anim = { workspace = true }
bytemuck     = { workspace = true }
somnium_shader = { workspace = true }
# wgpu's own front end, already in the graph through wgpu. A regular dependency
# rather than a dev one because MORROWIND-C's hot reload has to produce naga's
# diagnostic synchronously, and wgpu only surfaces shader errors through an
# async error scope.
naga = { version = "30", features = ["wgsl-in"] }
somnium_asset = { workspace = true }
rayon        = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
sha2 = "0.10"
# Phase 25K: decoding the packed terrain layer PNGs at load.
image        = { workspace = true }
exr          = { workspace = true }
# AMD FSR 3 temporal upscaler (MIT). Shaders are precompiled SPIR-V in
# wgpu-ffx-shaders-spv — no glslc at build time.
wgpu-ffx     = { path = "../../third_party/wgpu-ffx" }
# AMD FSR 3 frame interpolation and optical flow (MIT), translated to WGSL
# (17 Oct 2026): no shader compiler needed, validated by naga like ours.
wgpu-ffx-fg  = { path = "../../third_party/wgpu-ffx-fg" }
# BC7 encoder: precompiled ISPC kernels (Traverse Research fork of Graham
# Wihlidal's intel_tex). Imported glTF textures are compressed at first load and
# cached (`imported_bc.rs`); `examples/encode_terrain_bc7.rs` uses it offline.
intel_tex_2 = "0.5.0"

[dev-dependencies]
# `tests/shaders_validate.rs` uses the `naga` above, which MORROWIND-C promoted
# to a regular dependency for hot reload. Leaving a second copy pinned here is
# how the test ends up validating with a different front end from the one that
# compiles the shaders — which is exactly what happened between MORROWIND-A2 and
# MORROWIND-C, and it hid a real wgpu 30 incompatibility for a whole sub-phase.
