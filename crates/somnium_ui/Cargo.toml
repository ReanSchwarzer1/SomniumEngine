[package]
name        = "somnium_ui"
description = "Native retained UI toolkit and Nocturne editor chrome for the Somnium Engine."
version.workspace      = true
edition.workspace      = true
rust-version.workspace  = true
license.workspace      = true
authors.workspace      = true

[dependencies]
winit      = { workspace = true }
wgpu       = { workspace = true }
tracing    = { workspace = true }
somnium_ecs = { path = "../somnium_ecs" }
somnium_asset = { path = "../somnium_asset" }
somnium_anim = { path = "../somnium_anim" }
somnium_shader = { path = "../somnium_shader" }
glam       = { workspace = true }
bytemuck   = { workspace = true }
fontdue    = { workspace = true }
resvg      = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
accesskit = "0.24.1"
rustybuzz    = { workspace = true }
unicode-bidi = { workspace = true }

[dev-dependencies]
# wgpu's own front end, already in the graph through wgpu. `somnium_renderer`
# has validated its shaders in `cargo test` since Phase 25; `somnium_ui` did
# not, so its two shaders were only ever compiled at device-creation time --
# on a machine with a GPU, at startup, as a first-frame crash. MORROWIND-D adds
# a binding array to both of them, which is exactly the construct that broke
# between wgpu 29 and 30.
#
# Pinned to the same major as the workspace `wgpu`. MORROWIND-C found that a
# stale copy of this dependency validates with a different front end from the
# one that compiles the shaders, and hid a real incompatibility for a whole
# sub-phase.
naga = { version = "30", features = ["wgsl-in"] }
