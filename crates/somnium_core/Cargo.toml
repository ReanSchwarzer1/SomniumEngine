[package]
name        = "somnium_core"
description = "Core application loop, timing, events, and configuration for the Somnium Engine."
version.workspace     = true
edition.workspace     = true
rust-version.workspace = true
license.workspace     = true
authors.workspace     = true

[dependencies]
somnium_ecs = { workspace = true }
# Seam 1. MORROWIND-B promoted this crate's own `JobRegistry` into it.
somnium_jobs = { workspace = true }
somnium_script = { workspace = true }
# Phase 16-C. The backend is named here, once, so `ScriptHost` can install
# it — and nowhere else. Every other crate, and every other module in this
# one, sees only `somnium_script`'s neutral types. (The reverse edge is a
# dev-dependency in `somnium_script_luau`, which Cargo permits and which
# does not make the build graph cyclic.)
somnium_script_luau = { workspace = true }
somnium_renderer = { workspace = true }
somnium_physics = { workspace = true }
somnium_audio   = { workspace = true }
somnium_ui      = { workspace = true }
somnium_asset   = { workspace = true }
winit              = { workspace = true }
glam               = { workspace = true }
thiserror          = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
pollster           = { workspace = true }
base64             = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
rfd                = { workspace = true }
