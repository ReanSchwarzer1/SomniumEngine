name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build & test (Windows)
    runs-on: windows-latest
    env:
      RUSTFLAGS: -D warnings   # rustc warnings fail the build gate
    steps:
      - uses: actions/checkout@v4

      # Toolchain is pinned via rust-toolchain.toml; this just reports it.
      - name: Show Rust version
        run: rustc --version && cargo --version

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2

      # The physics crate compiles Jolt C++ (vendored at
      # example_repo/JoltPhysics-master/), so a C++ toolchain is required.
      # windows-latest ships MSVC, which the cc crate picks up automatically.
      - name: Build (workspace)
        run: cargo build --workspace --all-targets

      # GPU-dependent paths are not exercised in CI (no adapter on the runner);
      # the library unit tests are pure CPU (ECS, voxel, terrain math).
      - name: Test (library unit tests)
        run: cargo test --workspace --lib

  clippy:
    name: Clippy (advisory)
    runs-on: windows-latest
    # Informational: surfaces lint suggestions in the log without failing the
    # run. Lints are NOT treated as errors here (no -D warnings), so the job
    # stays green; tighten this once the workspace is fully clippy-clean.
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets
